name: Linux - sympy

on:
  push:
  pull_request:

  workflow_dispatch:

jobs:
  build:
    name: Python-${{matrix.python}}-sympy-${{matrix.sympy}}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.15']
        # The lower bound of sympy/requirements.txt and the newest release.
        sympy: [lowest, newest]
        include:
          - sympy: lowest
            constraint: sympy==1.12.*
          - sympy: newest
            constraint: ''

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{matrix.python}}
          cache: pip
          cache-dependency-path: sympy/requirements.txt

      - name: Setup Dependencies
        run: |
          pip install -r sympy/requirements.txt ${{matrix.constraint}}

      - name: Run sympy tests
        run: |
          cd sympy
          ./run_tests.sh
