name: Linux - sympy

on:
  push:
  pull_request:

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    name: Python-${{matrix.python}}-sympy-${{matrix.sympy}}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.15']
        # The lower bound of sympy/requirements.txt and the newest release.
        sympy: [lowest, newest]
        include:
          - sympy: lowest
            constraint: sympy==1.12.*
          - sympy: newest
            constraint: ''

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{matrix.python}}
          cache: pip
          cache-dependency-path: sympy/requirements.txt

      - name: Setup Dependencies
        run: |
          pip install -r sympy/requirements.txt ${{matrix.constraint}}

      - name: Run sympy tests
        run: |
          cd sympy
          ./run_tests.sh
